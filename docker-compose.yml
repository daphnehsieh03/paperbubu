# PostgreSQL for local development. Run API/frontend on the host (see README).
# Connection: postgresql+psycopg://papertrail:papertrail@127.0.0.1:5432/papertrail

services:
  db:
    image: postgres:16-alpine
    container_name: papertrail_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: papertrail
      POSTGRES_PASSWORD: papertrail
      POSTGRES_DB: papertrail
    ports:
      - "5432:5432"
    volumes:
      - papertrail_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papertrail -d papertrail"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  papertrail_pg:
